# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: sanchpet
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: ru-RU
  baseUrl: sanch.pet
  ignorePatterns:
    - README.md
    - private
    - templates
    - .obsidian
    # Obsidian-side views (book cards, series); their filters are vault paths.
    - "*.base"
    # Drawing sources; the page embeds the SVG rendered from them.
    - "**/*.excalidraw.md"
    # What the site itself says (feed note, language note); local-plugins/site-texts.ts reads them.
    - ru/site.md
    - en/site.md
    # Quartz's own icon and social card; local-plugins/brand.tsx emits ours.
    - icon.png
    - og-image.png
  theme:
    # The site serves its fonts itself (local-plugins/fonts.ts); nothing is loaded from Google.
    fontOrigin: local
    cdnCaching: true
    typography:
      header:
        name: Literata
        weights: [600, 700]
      body:
        name: Literata
        weights: [400, 600]
        includeItalic: true
      code: IBM Plex Mono
    # Paper and graphite (DESIGN.md): the page is workbook paper, pencil is the text colour.
    # `gray` is read as text, so it clears 4.5:1 on `light` in both modes.
    colors:
      lightMode:
        light: "#FAF5E9"
        lightgray: "#E3D9C4"
        gray: "#6B6459"
        darkgray: "#33302B"
        dark: "#1B1A1C"
        secondary: "#1E3959"
        tertiary: "#8C2F39"
        highlight: rgba(30, 57, 89, 0.08)
        textHighlight: "#F2B70566"
      darkMode:
        light: "#161819"
        lightgray: "#3B3832"
        gray: "#A39B8C"
        darkgray: "#DAD3C5"
        dark: "#F5ECDC"
        secondary: "#9DBADB"
        tertiary: "#E0B25A"
        highlight: rgba(157, 186, 219, 0.12)
        textHighlight: "#F2B70555"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    # This plugin, not theme.typography, is what sets the font variables.
    options:
      fontOrigin: local
      useThemeFonts: false
      # Stacks, not names: the fallback faces of local-plugins/fonts.ts hold the web fonts' room
      # until they arrive. Weights only matter for Google Fonts, which this site does not use.
      header: '"Literata", "Literata Fallback", serif'
      body: '"Literata", "Literata Fallback", serif'
      code: '"IBM Plex Mono", "IBM Plex Mono Fallback", monospace'
      interface: '"Literata", "Literata Fallback", serif'
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: false
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      # local-plugins/feed.tsx emits the feeds: Atom per language, publications only.
      enableRSS: false
  - source: "@quartz-community/favicon"
    enabled: false
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    # The graph opens zoomed in (local-plugins/garden-styles.tsx); at that zoom the plugin would
    # show every name faintly, one over another. Lowered so a name shows on hover only.
    options:
      localGraph:
        opacityScale: 0.5
      globalGraph:
        opacityScale: 0.6
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: false
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options:
      defaultViewType: bookcase
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
