name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [garden-texts, races-feed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.share.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # Full history: page dates come from git, and a shallow clone silently stamps every text with HEAD's date.
      - uses: actions/checkout@v6
        with:
          repository: sanchpet/garden-texts
          path: content
          fetch-depth: 0

      # The race calendar's data: one JSON on the public branch of sanchpet/races.
      - uses: actions/checkout@v6
        with:
          repository: sanchpet/races
          ref: public
          path: races-feed

      # A broken feed must not hold back a text: fall back to the feed the site already serves.
      - name: Check the race feed
        run: |
          check() { jq -e '(.events | length > 0) and (.regions | length > 0) and (.regions | all(.labels.en))' "$1" > /dev/null; }
          if ! check races-feed/events.json; then
            echo "::warning::The race feed is missing or broken; keeping the one already published."
            curl -fsS --retry 3 -o races-feed/events.json https://sanch.pet/static/races/events.json
            check races-feed/events.json
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          set -o pipefail
          npx quartz build -d content -o public 2>&1 | tee build.log

      - name: Report stripped private links
        run: |
          {
            echo "## Private links stripped"
            grep 'garden: private link stripped' build.log | sed 's/^.*stripped: /- /' || echo "None."
          } >> "$GITHUB_STEP_SUMMARY"
          grep 'garden: private link stripped' build.log | sed 's/^/::warning::/' || true

      # Telegram cannot reach the hub, so share links go through GitHub Pages (local-plugins/share.tsx).
      - name: Split out the share stubs
        run: mv public/.share share

      # The cluster serves this branch through git-sync, so a single commit keeps its clone small.
      - name: Push to the public branch
        working-directory: public
        run: |
          texts=$(git -C ../content rev-parse --short HEAD)
          git init -q -b public
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build from garden ${GITHUB_SHA::7}, garden-texts ${texts}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: share

      - id: share
        uses: actions/deploy-pages@v5
